name: Monitoreo de TaskManager

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar disponibilidad del servicio
        env:
          APP_URL: ${{ secrets.TASKMANAGER_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "TASKMANAGER_URL no está configurada. Configura TASKMANAGER_URL después del despliegue."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 "$APP_URL/health"
