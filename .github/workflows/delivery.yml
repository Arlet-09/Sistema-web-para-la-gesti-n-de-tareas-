name: Entrega Continua

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  preparar-artefacto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-v1
          path: |
            app.py
            requirements.txt
            templates/
            static/
            README.md
            render.yaml
